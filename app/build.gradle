plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'gr.vassbak.standby'
    compileSdk 34

    defaultConfig {
        applicationId 'gr.vassbak.standby'
        minSdk 26
        targetSdk 34
        // Κάθε build στο GitHub παίρνει μεγαλύτερο αριθμό έκδοσης
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '13').toInteger() + 100)
        versionName "2.3"
    }

    // Σταθερό κλειδί υπογραφής από τα GitHub secrets (STANDBY_KEYSTORE / STANDBY_KEYSTORE_PASSWORD):
    // κάθε νέο APK εγκαθίσταται ως ενημέρωση πάνω στο προηγούμενο, χωρίς απεγκατάσταση.
    // Αν δεν έχουν οριστεί, χρησιμοποιείται το προσωρινό debug κλειδί όπως πριν.
    def ks = file('standby.keystore')
    if (ks.exists()) {
        signingConfigs {
            standby {
                storeFile ks
                storePassword System.getenv('STANDBY_KEYSTORE_PASSWORD')
                keyAlias 'standby'
                keyPassword System.getenv('STANDBY_KEYSTORE_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.standby }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
